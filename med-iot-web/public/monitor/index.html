<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Med-IoT | Monitor en Tiempo Real</title>
    <style>
        /* =========================================
           ESTILOS BASE — Sin frameworks CSS
        ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor {
            width: 90%;
            max-width: 820px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 28px;
        }

        h1 {
            font-size: 1.4rem;
            color: #58a6ff;
            margin-bottom: 6px;
        }

        .subtitulo {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 24px;
        }

        /* Panel de estado de alerta */
        #panelAlerta {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            border: 1px solid #30363d;
            background-color: #0d1117;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        #panelAlerta.seguro {
            border-color: #238636;
            background-color: rgba(35, 134, 54, 0.1);
        }

        #panelAlerta.critico {
            border-color: #da3633;
            background-color: rgba(218, 54, 51, 0.1);
            animation: parpadeo 1s infinite;
        }

        @keyframes parpadeo {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        #indicador {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #8b949e;
            flex-shrink: 0;
        }

        #indicador.seguro   { background-color: #3fb950; }
        #indicador.critico  { background-color: #f85149; }

        /* Umbral configurable */
        .control-umbral {
            margin-bottom: 24px;
        }

        .control-umbral label {
            display: block;
            font-size: 0.8rem;
            color: #8b949e;
            margin-bottom: 6px;
        }

        .fila-slider {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #sliderUmbral {
            flex: 1;
            accent-color: #58a6ff;
            cursor: pointer;
            height: 4px;
        }

        #valorUmbral {
            font-size: 0.95rem;
            font-weight: bold;
            color: #58a6ff;
            min-width: 50px;
        }

        /* Área del gráfico */
        .grafico-wrapper {
            position: relative;
            width: 100%;
            height: 340px;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Monitor de Sensor Med-IoT</h1>
        <p class="subtitulo">
            Datos en tiempo real desde Firebase Realtime Database · Alertas automáticas vía Telegram
        </p>

        <!-- Panel de estado de alerta -->
        <div id="panelAlerta">
            <span id="indicador"></span>
            <span id="textoAlerta">Esperando datos del sensor...</span>
        </div>

        <!-- Control de umbral configurable sin frameworks -->
        <div class="control-umbral">
            <label for="sliderUmbral">Umbral crítico de temperatura:</label>
            <div class="fila-slider">
                <input
                    type="range"
                    id="sliderUmbral"
                    min="0"
                    max="100"
                    value="80"
                >
                <span id="valorUmbral">80 °C</span>
            </div>
        </div>

        <!-- ELEMENTO CANVAS REQUERIDO — Chart.js dibuja aquí -->
        <div class="grafico-wrapper">
            <canvas id="miGrafico"></canvas>
        </div>
    </div>

    <!-- CDN de Chart.js al final del <body> (sin frameworks) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Archivo de lógica en JavaScript puro importado como Módulo ES -->
    <script type="module" src="app.js"></script>

</body>
</html>
